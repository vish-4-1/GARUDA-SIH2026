services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: garuda-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/garuda.db}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173","*"]'
    ports:
      - "8000:8000"
    volumes:
      - garuda_data:/app/data
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - garuda-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: garuda-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - garuda-net

networks:
  garuda-net:
    driver: bridge

volumes:
  garuda_data:
    driver: local
