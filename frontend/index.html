<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/garuda-eagle.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GARUDA — AI-Enabled Drone & Counter-Drone Threat Simulation Trainer</title>
    <meta name="description" content="AI-Enabled Drone & Counter-Drone Threat Simulation Trainer. Real-time tactical kinematics, degraded evidence analysis, decision assessment, and adaptive training." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('garuda-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#08090B] text-slate-900 dark:text-slate-100 font-sans antialiased min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
